<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512">
	<!-- фон -->
	<rect width="512" height="512" rx="64" fill="#FFFFFF"/>

	<!-- стопка постов -->
	<g transform="translate(60,80)">
		<rect x="20" y="120" width="280" height="150" rx="20" fill="#EAF2FF"/>
		<rect x="10" y="70" width="280" height="150" rx="20" fill="#FFFFFF" stroke="#E1E9F8" stroke-width="2"/>
		<rect x="0" y="20" width="280" height="150" rx="20" fill="#FFFFFF" stroke="#D7E6FB" stroke-width="2"/>

		<!-- текстовые линии -->
		<g fill="#9AAFD6">
			<rect x="40" y="50" width="200" height="10" rx="5"/>
			<rect x="40" y="70" width="160" height="10" rx="5"/>
			<rect x="40" y="90" width="220" height="10" rx="5"/>
		</g>

		<!-- аватар -->
		<circle cx="30" cy="40" r="12" fill="#CFE4FF"/>
	</g>

	<!-- увеличительное стекло -->
	<g transform="translate(220, 200)">
		<rect x="124" y="124" width="112" height="24" rx="12" transform="rotate(40 180 136)" fill="#334155"/>
		<circle cx="80" cy="80" r="72" fill="#FFFFFF" stroke="#1E40AF" stroke-width="12"/>
		<circle cx="80" cy="80" r="44" fill="#E7F0FF"/>
		<path d="M56 56c12-12 32-12 44 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
	</g>

	<!-- значок оффлайн -->
	<g transform="translate(340,50)">
		<rect width="128" height="128" rx="24" fill="#0EA5A3"/>
		<path d="M44 76c-12 0-20-8-20-18 0-8 6-16 16-18 2-12 12-20 24-20 12 0 22 8 24 18 10 0 18 8 18 18 0 12-10 22-24 22H44z"
			  fill="#CFFBF6"/>
		<line x1="20" y1="108" x2="108" y2="20" stroke="#065F54" stroke-width="12" stroke-linecap="round"/>
	</g>
</svg>
